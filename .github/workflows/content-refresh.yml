name: Content Refresh Agent

on:
  schedule:
    - cron: '15 */2 * * *' # every 2 hours — picks up investigate_drop tasks the GSC/GA4 Watcher queues
  workflow_dispatch: {}

jobs:
  run-content-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm run content-refresh:run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
