name: Internal Linking Agent

on:
  schedule:
    - cron: '30 */6 * * *' # every 6 hours — cheap to run since it's pure technical work
  workflow_dispatch: {}

jobs:
  run-internal-linking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm run internal-linking:run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
